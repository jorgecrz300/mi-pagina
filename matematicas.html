<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalla Algebraica: Campo de Batalla Dinámico</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        #canvas-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            background-color: #0d1117;
            display: block;
        }

        #log {
            margin-top: 15px;
            width: 800px;
            height: 140px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
        }

        .log-entry { margin-bottom: 4px; }
        .bot-0 { color: #ff5555; }
        .bot-1 { color: #55ff55; }
        .bot-2 { color: #5588ff; }
        .type-tag { font-weight: bold; color: #e3b341; }
        .move-tag { font-weight: bold; color: #38bdf8; }
        .warn-tag { font-weight: bold; color: #ff3333; }
    </style>
</head>
<body>

    <h1>Batalla Algebraica: Campo de Batalla Dinámico</h1>
    <div id="canvas-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>
    <div id="log"></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const logContainer = document.getElementById('log');

        const WIDTH = canvas.width;
        const HEIGHT = canvas.height;
        const ORIGIN_X = WIDTH / 2;
        const ORIGIN_Y = HEIGHT / 2;
        const SCALE = 20;

        // Estado de los Bots
        const bots = [
            { id: 0, name: "Bot Rojo", color: "#ff5555", x: -16, y: -4, hp: 100 },
            { id: 1, name: "Bot Verde", color: "#55ff55", x: 0, y: 7, hp: 100 },
            { id: 2, name: "Bot Azul", color: "#5588ff", x: 15, y: -2, hp: 100 }
        ];

        // Múltiples Obstáculos tipo "Campo de Batalla"
        const obstacles = [
            { xMin: -12, xMax: -10, yMin: -8, yMax: 1, name: "Muro Izquierdo", color: '#d97706' },
            { xMin: -5, xMax: -3, yMin: -8, yMax: -2, name: "Búnker Bajo 1", color: '#78350f' },
            { xMin: -1, xMax: 1, yMin: -8, yMax: 3, name: "Torre Central", color: '#9f1239' },
            { xMin: 3, xMax: 5, yMin: -8, yMax: -2, name: "Búnker Bajo 2", color: '#78350f' },
            { xMin: 10, xMax: 12, yMin: -8, yMax: 2, name: "Muro Derecho", color: '#d97706' }
        ];

        let turn = 0;
        let currentProjectile = null;

        function toScreenX(mathX) { return ORIGIN_X + mathX * SCALE; }
        function toScreenY(mathY) { return ORIGIN_Y - mathY * SCALE; }

        function addLog(text, botClass) {
            const entry = document.createElement('div');
            entry.className = `log-entry ${botClass}`;
            entry.innerHTML = text;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function drawGrid() {
            ctx.strokeStyle = '#21262d';
            ctx.lineWidth = 1;

            for (let x = 0; x < WIDTH; x += SCALE) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, HEIGHT); ctx.stroke();
            }
            for (let y = 0; y < HEIGHT; y += SCALE) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WIDTH, y); ctx.stroke();
            }

            ctx.strokeStyle = '#8b949e';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(ORIGIN_X, 0); ctx.lineTo(ORIGIN_X, HEIGHT); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, ORIGIN_Y); ctx.lineTo(WIDTH, ORIGIN_Y); ctx.stroke();
        }

        function drawObstacles() {
            obstacles.forEach(obs => {
                let sx = toScreenX(obs.xMin);
                let sy = toScreenY(obs.yMax);
                let w = (obs.xMax - obs.xMin) * SCALE;
                let h = (obs.yMax - obs.yMin) * SCALE;

                ctx.fillStyle = obs.color;
                ctx.fillRect(sx, sy, w, h);
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(sx, sy, w, h);
            });
        }

        function drawBots() {
            bots.forEach(bot => {
                if (bot.hp <= 0) return;
                ctx.fillStyle = bot.color;
                ctx.beginPath();
                ctx.arc(toScreenX(bot.x), toScreenY(bot.y), 12, 0, Math.PI * 2);
                ctx.fill();

                // Barra de vida
                ctx.fillStyle = "#333";
                ctx.fillRect(toScreenX(bot.x) - 15, toScreenY(bot.y) - 22, 30, 5);
                ctx.fillStyle = bot.color;
                ctx.fillRect(toScreenX(bot.x) - 15, toScreenY(bot.y) - 22, (bot.hp / 100) * 30, 5);
            });
        }

        function isInsideObstacle(x, y) {
            return obstacles.some(obs => x >= obs.xMin && x <= obs.xMax && y >= obs.yMin && y <= obs.yMax);
        }

        // Mover al bot a una nueva posición válida antes de su tiro
        function moveBot(bot) {
            let moveDistance = (Math.random() - 0.5) * 6; // Se mueve entre -3 y +3 unidades
            let newX = Math.min(Math.max(bot.x + moveDistance, -19), 19);

            // Validar que no quede incrustado dentro de un obstáculo
            if (!isInsideObstacle(newX, bot.y)) {
                let oldX = bot.x.toFixed(1);
                bot.x = parseFloat(newX.toFixed(1));
                addLog(`<span class="move-tag">[MOVIMIENTO]</span> ${bot.name} se movió de X: ${oldX} a X: ${bot.x}`, `bot-${bot.id}`);
            }
        }

        function checkObstacleInLine(x1, y1, x2, y2) {
            let m = (y2 - y1) / (x2 - x1);
            let b = y1 - m * x1;

            for (let obs of obstacles) {
                let minX = Math.min(x1, x2);
                let maxX = Math.max(x1, x2);

                if (obs.xMax >= minX && obs.xMin <= maxX) {
                    let checkX = (obs.xMin + obs.xMax) / 2;
                    let checkY = m * checkX + b;
                    if (checkY >= obs.yMin && checkY <= obs.yMax) {
                        return true;
                    }
                }
            }
            return false;
        }

        function botTurn() {
            const attacker = bots[turn];
            if (attacker.hp <= 0) { nextTurn(); return; }

            let targets = bots.filter(b => b.id !== attacker.id && b.hp > 0);
            if (targets.length === 0) {
                addLog(`<strong>¡${attacker.name} ha ganado la guerra algebraia!</strong>`, `bot-${attacker.id}`);
                return;
            }

            // 1. Fase de Movimiento
            moveBot(attacker);

            // 2. Selección de objetivo y tiro
            let target = targets[Math.floor(Math.random() * targets.length)];
            let x1 = attacker.x, y1 = attacker.y;
            let x2 = target.x, y2 = target.y;

            let hasObstacle = checkObstacleInLine(x1, y1, x2, y2);
            let mathType = hasObstacle ? (Math.random() > 0.5 ? 1 : 2) : 0;

            let f, eqStr, typeName;

            if (mathType === 0) {
                typeName = "LINEAL";
                let m = (y2 - y1) / (x2 - x1) + (Math.random() - 0.5) * 0.04;
                let b = y1 - m * x1;
                f = (x) => m * x + b;
                eqStr = `y = ${m.toFixed(2)}x ${b >= 0 ? '+' : ''}${b.toFixed(2)}`;

            } else if (mathType === 1) {
                typeName = "CUADRÁTICA";
                let a = -0.15 - Math.random() * 0.08; 
                let y1_prime = y1 - a * x1 * x1;
                let y2_prime = y2 - a * x2 * x2;
                let b = (y2_prime - y1_prime) / (x2 - x1);
                let c = y1_prime - b * x1;

                f = (x) => a * x * x + b * x + c;
                eqStr = `y = ${a.toFixed(2)}x² ${b >= 0 ? '+' : ''}${b.toFixed(2)}x ${c >= 0 ? '+' : ''}${c.toFixed(2)}`;

            } else {
                typeName = "CÚBICA";
                let a = (x2 > x1 ? 0.01 : -0.01);
                let x3 = (x1 + x2) / 2;
                let m = (y2 - y1) / (x2 - x1);
                let b = y1 - m * x1;

                f = (x) => a * (x - x1) * (x - x2) * (x - x3) + (m * x + b);
                eqStr = `y = ${a.toFixed(3)}(x - ${x3.toFixed(1)})³ + line`;
            }

            addLog(`<span class="type-tag">[${typeName}]</span> ${attacker.name} dispara: <code>${eqStr}</code>`, `bot-${attacker.id}`);

            currentProjectile = {
                f: f,
                startX: x1,
                currentX: x1,
                step: (x2 > x1) ? 0.25 : -0.25,
                color: attacker.color,
                attackerId: attacker.id
            };
        }

        function updateProjectile() {
            if (!currentProjectile) return;

            let p = currentProjectile;
            p.currentX += p.step;
            let currentY = p.f(p.currentX);

            // Dibujar proyectil
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(toScreenX(p.currentX), toScreenY(currentY), 5, 0, Math.PI * 2);
            ctx.fill();

            // Colisión con Obstáculos
            for (let obs of obstacles) {
                if (p.currentX >= obs.xMin && p.currentX <= obs.xMax &&
                    currentY >= obs.yMin && currentY <= obs.yMax) {
                    addLog(`<span class="warn-tag">¡IMPACTO EN OBSTÁCULO!</span> El tiro pegó en ${obs.name}`, "");
                    currentProjectile = null;
                    setTimeout(nextTurn, 1000);
                    return;
                }
            }

            // Colisión con Bots
            bots.forEach(bot => {
                if (bot.id !== p.attackerId && bot.hp > 0) {
                    let dist = Math.hypot(bot.x - p.currentX, bot.y - currentY);
                    if (dist < 1.0) {
                        bot.hp = Math.max(0, bot.hp - 35);
                        addLog(`¡Impacto directo en ${bot.name}! Vida: ${bot.hp}`, `bot-${bot.id}`);
                        currentProjectile = null;
                        setTimeout(nextTurn, 1000);
                    }
                }
            });

            if (p.currentX < -25 || p.currentX > 25 || Math.abs(currentY) > 20) {
                currentProjectile = null;
                setTimeout(nextTurn, 1000);
            }
        }

        function nextTurn() {
            turn = (turn + 1) % bots.length;
            botTurn();
        }

        function gameLoop() {
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            drawGrid();
            drawObstacles();
            drawBots();
            updateProjectile();
            requestAnimationFrame(gameLoop);
        }

        addLog("¡Iniciando simulación en el campo de batalla!", "");
        gameLoop();
        setTimeout(botTurn, 1000);
    </script>
</body>
</html>
