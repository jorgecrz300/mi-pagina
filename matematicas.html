<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphwar Clone - Batalla Algebraica</title>
    <script src="https://cdnjs.cloudflare.com/mathjs/11.8.0/math.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        h1 { margin-bottom: 5px; color: #38bdf8; }
        p { margin-top: 0; color: #94a3b8; }

        #canvas-container {
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #334155;
        }

        canvas {
            background-color: #020617;
            display: block;
        }

        #controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            width: 800px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 10px 15px;
            background-color: #1e293b;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #f8fafc;
            font-size: 16px;
            font-family: monospace;
        }

        button {
            padding: 10px 20px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: #0369a1; }

        #log {
            margin-top: 15px;
            width: 800px;
            height: 100px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            box-sizing: border-box;
        }

        .log-entry { margin-bottom: 4px; }
        .bot-0 { color: #f87171; }
        .bot-1 { color: #4ade80; }
        .bot-2 { color: #60a5fa; }
    </style>
</head>
<body>

    <h1>Graphwar JS</h1>
    <p>Escribe tu función en términos de <code>x</code>. ¡Usa <code>sin(x)</code>, <code>abs(x)</code>, <code>x^2</code>, etc.!</p>

    <div id="canvas-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <div id="controls">
        <input type="text" id="mathInput" placeholder="Ejemplo: -0.1*(x-2)^2 + 5  o  sin(x)*2" value="-0.05*x^2 + 4">
        <button onclick="playerFire()">Disparar</button>
    </div>

    <div id="log"></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const logContainer = document.getElementById('log');

        const WIDTH = canvas.width;
        const HEIGHT = canvas.height;
        const ORIGIN_X = WIDTH / 2;
        const ORIGIN_Y = HEIGHT / 2;
        const SCALE = 20;

        // Jugador (rojo) y 2 Bots (verde y azul)
        const players = [
            { id: 0, name: "Tú (Rojo)", color: "#f87171", x: -16, y: -4, hp: 100, isHuman: true },
            { id: 1, name: "Bot Verde", color: "#4ade80", x: 0, y: 7, hp: 100, isHuman: false },
            { id: 2, name: "Bot Azul", color: "#60a5fa", x: 15, y: -2, hp: 100, isHuman: false }
        ];

        const obstacles = [
            { xMin: -10, xMax: -8, yMin: -8, yMax: 2 },
            { xMin: -2, xMax: 2, yMin: -8, yMax: 4 },
            { xMin: 8, xMax: 10, yMin: -8, yMax: 1 }
        ];

        let turn = 0;
        let currentProjectile = null;

        function toScreenX(mathX) { return ORIGIN_X + mathX * SCALE; }
        function toScreenY(mathY) { return ORIGIN_Y - mathY * SCALE; }

        function addLog(text, cssClass = "") {
            const entry = document.createElement('div');
            entry.className = `log-entry ${cssClass}`;
            entry.innerHTML = text;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function drawGrid() {
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;

            for (let x = 0; x < WIDTH; x += SCALE) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, HEIGHT); ctx.stroke();
            }
            for (let y = 0; y < HEIGHT; y += SCALE) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WIDTH, y); ctx.stroke();
            }

            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(ORIGIN_X, 0); ctx.lineTo(ORIGIN_X, HEIGHT); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, ORIGIN_Y); ctx.lineTo(WIDTH, ORIGIN_Y); ctx.stroke();
        }

        function drawObstacles() {
            obstacles.forEach(obs => {
                let sx = toScreenX(obs.xMin);
                let sy = toScreenY(obs.yMax);
                let w = (obs.xMax - obs.xMin) * SCALE;
                let h = (obs.yMax - obs.yMin) * SCALE;

                ctx.fillStyle = '#b45309';
                ctx.fillRect(sx, sy, w, h);
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 1;
                ctx.strokeRect(sx, sy, w, h);
            });
        }

        function drawPlayers() {
            players.forEach(p => {
                if (p.hp <= 0) return;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(toScreenX(p.x), toScreenY(p.y), 10, 0, Math.PI * 2);
                ctx.fill();

                // Salud
                ctx.fillStyle = "#334155";
                ctx.fillRect(toScreenX(p.x) - 15, toScreenY(p.y) - 20, 30, 4);
                ctx.fillStyle = p.color;
                ctx.fillRect(toScreenX(p.x) - 15, toScreenY(p.y) - 20, (p.hp / 100) * 30, 4);
            });
        }

        function fireFunction(exprString, shooter) {
            try {
                // Compilamos la función ingresada con math.js
                const compiledExpr = math.compile(exprString);
                
                // Ajustamos offset de la función para que nazca desde la posición del tirador
                const startY = compiledExpr.evaluate({ x: shooter.x });
                const offsetY = shooter.y - startY;

                addLog(`<strong>${shooter.name}</strong> disparó: <code>y = ${exprString}</code>`, `bot-${shooter.id}`);

                currentProjectile = {
                    evaluate: (x) => compiledExpr.evaluate({ x: x }) + offsetY,
                    currentX: shooter.x,
                    step: 0.2,
                    color: shooter.color,
                    shooterId: shooter.id
                };
            } catch (err) {
                addLog(`Error en la fórmula matemática: ${err.message}`, "bot-0");
                setTimeout(nextTurn, 1000);
            }
        }

        function playerFire() {
            if (turn !== 0 || currentProjectile) return;
            const input = document.getElementById('mathInput').value;
            fireFunction(input, players[0]);
        }

        function botTurn() {
            const bot = players[turn];
            if (bot.hp <= 0) { nextTurn(); return; }

            let targets = players.filter(p => p.id !== bot.id && p.hp > 0);
            if (targets.length === 0) {
                addLog(`<strong>¡${bot.name} gana la partida!</strong>`);
                return;
            }

            let target = targets[Math.floor(Math.random() * targets.length)];
            
            // Los bots generan ecuaciones adaptadas a Math.js
            let formulas = [
                `-0.1 * (x - ${((bot.x + target.x)/2).toFixed(1)})^2 + 5`,
                `sin(x) + ${(target.y - bot.y).toFixed(1)}`,
                `0.05 * (x - ${bot.x.toFixed(1)}) * (x - ${target.x.toFixed(1)})`
            ];

            let chosen = formulas[Math.floor(Math.random() * formulas.length)];
            fireFunction(chosen, bot);
        }

        function updateProjectile() {
            if (!currentProjectile) return;

            let p = currentProjectile;
            p.currentX += p.step;

            let currentY;
            try {
                currentY = p.evaluate(p.currentX);
            } catch (e) {
                currentProjectile = null;
                nextTurn();
                return;
            }

            // Dibujar punto
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(toScreenX(p.currentX), toScreenY(currentY), 4, 0, Math.PI * 2);
            ctx.fill();

            // Colisión con obstáculos
            for (let obs of obstacles) {
                if (p.currentX >= obs.xMin && p.currentX <= obs.xMax &&
                    currentY >= obs.yMin && currentY <= obs.yMax) {
                    addLog(`Impacto en obstáculo en (${p.currentX.toFixed(1)}, ${currentY.toFixed(1)})`);
                    currentProjectile = null;
                    setTimeout(nextTurn, 800);
                    return;
                }
            }

            // Colisión con jugadores
            players.forEach(player => {
                if (player.id !== p.shooterId && player.hp > 0) {
                    let dist = Math.hypot(player.x - p.currentX, player.y - currentY);
                    if (dist < 1.0) {
                        player.hp = Math.max(0, player.hp - 40);
                        addLog(`¡Impacto en ${player.name}! Vida: ${player.hp}`, `bot-${player.id}`);
                        currentProjectile = null;
                        setTimeout(nextTurn, 800);
                    }
                }
            });

            // Salida de mapa
            if (p.currentX < -25 || p.currentX > 25 || Math.abs(currentY) > 20) {
                currentProjectile = null;
                setTimeout(nextTurn, 800);
            }
        }

        function nextTurn() {
            turn = (turn + 1) % players.length;
            if (!players[turn].isHuman && players[turn].hp > 0) {
                setTimeout(botTurn, 1000);
            } else if (players[turn].hp <= 0) {
                nextTurn();
            } else {
                addLog("<strong>Es tu turno.</strong> Escribe una ecuación y presiona Disparar.", "bot-0");
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            drawGrid();
            drawObstacles();
            drawPlayers();
            updateProjectile();
            requestAnimationFrame(gameLoop);
        }

        addLog("¡Bienvenido a Graphwar JS! Tu turno.", "bot-0");
        gameLoop();
    </script>
</body>
</html>
